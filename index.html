<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Allocation System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🏛️ MUST Hostel Portal</div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="apply.html">Apply</a>
        </nav>
    </header>

    <div class="container">
        <h2>Student Portal Sign In</h2>
        <p class="subtitle">Enter your University credentials to access hostel allocation services.</p>
        
        <form action="apply.html" method="GET">
            <div class="form-group">
                <label for="studentId">Student ID Number</label>
                <input type="text" id="studentId" placeholder="e.g. 23/U/MSD/0874/P" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-block">Secure Login</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Mbarara University of Science and Technology - Agile Group A</p>
    </footer>

</body>
</html>
