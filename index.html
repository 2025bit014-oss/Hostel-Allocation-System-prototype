<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Allocation System - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .role-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }
        .role-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .role-tab.active {
            color: var(--primary-pink);
            border-bottom: 3px solid var(--primary-pink);
            margin-bottom: -2px;
        }
        .login-form {
            display: none;
        }
        .login-form.active {
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🏛️ MUST Hostel Portal</div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="apply.html">Apply</a>
        </nav>
    </header>

    <div class="container">
        <h2>Portal Sign In</h2>
        <p class="subtitle">Select your portal type and enter your credentials.</p>
        
        <!-- Role Toggle Tabs -->
        <div class="role-tabs">
            <button class="role-tab active" onclick="switchPortal('student')">Student Portal</button>
            <button class="role-tab" onclick="switchPortal('admin')">Admin / Warden Portal</button>
        </div>

        <!-- Student Login Form -->
        <form id="studentForm" class="login-form active" action="apply.html" method="GET">
            <div class="form-group">
                <label for="studentId">Student ID Number</label>
                <input type="text" id="studentId" value="2025/BIT/001/P" required>
            </div>

            <div class="form-group">
                <label for="studentPassword">Password</label>
                <input type="password" id="studentPassword" placeholder="Enter your student password" required>
            </div>

            <button type="submit" class="btn btn-block">Sign In as Student</button>
        </form>

        <!-- Admin Login Form -->
        <form id="adminForm" class="login-form" action="apply.html" method="GET">
            <div class="form-group">
                <label for="adminId">Staff ID / Admin Username</label>
                <input type="text" id="adminId" placeholder="e.g. admin_warden@must.ac.ug" required>
            </div>

            <div class="form-group">
                <label for="adminPassword">Admin Password</label>
                <input type="password" id="adminPassword" placeholder="Enter administrator password" required>
            </div>

            <button type="submit" class="btn btn-block" style="background-color: #c2185b;">Sign In as Administrator</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Mbarara University of Science and Technology - Agile Group A</p>
    </footer>

    <script>
        function switchPortal(role) {
            const studentTab = document.querySelectorAll('.role-tab')[0];
            const adminTab = document.querySelectorAll('.role-tab')[1];
            const studentForm = document.getElementById('studentForm');
            const adminForm = document.getElementById('adminForm');

            if (role === 'student') {
                studentTab.classList.add('active');
                adminTab.classList.remove('active');
                studentForm.classList.add('active');
                adminForm.classList.remove('active');
            } else {
                adminTab.classList.add('active');
                studentTab.classList.remove('active');
                adminForm.classList.add('active');
                studentForm.classList.remove('active');
            }
        }
    </script>

</body>
</html>
